<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
        text-align: center;
        background-color: rgb(255, 255, 255);
        }
        canvas { 
            background-image: url("reloj.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-color: rgb(255, 255, 255);
        }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="600" height="600"></canvas>

    <script src="utils.js"></script>
    <script src="./classes/arrow.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas');
          context = canvas.getContext('2d');
          //arrow = new Arrow(),
          var hora = new Image();
          hora.src = "horas.png";

          var minutos = new Image();
          minutos.src = "minutos.png";

          var segundos = new Image();
          segundos.src = "segundos.png";

          var vrHora = 0.05;
          var vrMinutos = 0.5;
          var vrSegundos = 0.9;

          var radHora = 0;
          var radMinutos = 0;
          var radSegundos = 0;

(function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);

        context.clearRect(0, 0, canvas.width, canvas.height);

        context.save();
        context.translate(302, 295);
        radHora += vrHora * Math.PI / 180;
        context.rotate(radHora);
        context.drawImage(hora, -200, -200, 400, 400);
        context.restore();

        context.save();
        context.translate(305, 297);
        radMinutos += vrMinutos * Math.PI / 180;
        context.rotate(radMinutos);
        context.drawImage(minutos, -300, -300, 600, 600);
        context.restore();

        context.save();
        context.translate(305, 297);
        radSegundos += vrSegundos * Math.PI / 180;
        context.rotate(radSegundos);
        context.drawImage(segundos, -275, -275, 550, 550);
        context.restore();
      }());
    };
    </script>
  </body>
</html>
