<!doctype html>
<html>
 <head>
   <meta charset="utf-8">
   <title>Golden Globes</title>
   <style>
    body {
        background-color:rgb(254, 255, 237);
        text-align: center;
    }
    h1{
        color: black;
    }
    h2 {
        color:maroon;
        font-variant: small-caps;
    }
    p {
        color:gray;
        font-size: 40px;
    }
    </style>
    <script>
        function init(){
            var nombredeactor = document.getElementById("bestactor");
            nombredeactor.innerHTML = "Wagner Moura";

            window.onload = init;

            var nombrededrama = document.getElementById("bestdrama");
            nombrededrama.innerHTML = "Hamnet";

            window.onload = init;
        }
    </script>

 </head>
 <body>
     <h1>Golden Globe Winners 2026</h1>
 </br>
     <h2>Best Motion Picture - Drama</h2>
     <p id="bestdrama">Hamnet</p>
     <img src="hamnet.jpg" width="250" height="370">
 </br>
     <h2>Best Motion Picture - Musical or Comedy</h2>
     <p id="bestcomedy">One Battle After Another</p>
     <img src="onebattleafteranother.jpg" width="250" height="320">
 </br>
     <h2>Best performance by an actress in a motion picture - drama</h2>
     <p id="bestactress">Jessie Buckley</p>
     <img src="jessiebuckley.jpg" width="250" height="380">
 </br>
     <h2>Best performance by an actor in a motion picture - drama</h2>
     <p id="bestactor">Wagner Moura</p>
     <img src="wagnermoura.jpg" width="250" height="320">
 </body>
</html>
