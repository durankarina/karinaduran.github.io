    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #e5f3c9;
    color: #47423a;
}

header {
    text-align: center;
    padding: 40px 20px;
}

header h1 {

}

.menu {
    width: 90%;
    max-width: 1000px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.actividad {
    display: block;
    padding: 30px;
    background: white;
    border-radius: 15px;
    text-decoration: none;
    color: #47423a;

    box-shadow: 0 5px 15px rgba(0,0,0,0.1);

    transition: 0.3s;
}

.actividad:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.actividad h2 {
    margin-bottom: 10px;
}
